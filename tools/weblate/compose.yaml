name: tahachelly-weblate
services:
  cache:
    image: valkey/valkey:9.1.2
    command: [valkey-server, --save, '60', '1', --loglevel, warning]
    volumes: [redis-data:/data]
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
  database:
    image: postgres:18-alpine
    volumes: [postgres-data:/var/lib/postgresql]
    env_file: ["${TAHA_WEBLATE_STATE_DIR:?Use npm run weblate:start}/environment"]
    restart: unless-stopped
    mem_limit: 384m
  weblate:
    image: weblate/weblate@sha256:2e8915517818945a1a169d76939a98d9b55aae9f80e8d29b52c09ee366d99d2c
    depends_on: [cache, database]
    environment:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
    ports: ["127.0.0.1:8090:8080"]
    volumes: [weblate-data:/app/data, weblate-cache:/app/cache]
    env_file: ["${TAHA_WEBLATE_STATE_DIR:?Use npm run weblate:start}/environment"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/run, /tmp]
    mem_limit: 2g
volumes:
  weblate-data: {}
  weblate-cache: {}
  postgres-data: {}
  redis-data: {}
