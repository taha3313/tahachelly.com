name: Security and build checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npx --yes wrangler@4.151.0 deploy --dry-run
      - run: git diff --exit-code -- index.html dist _headers portfolio-i18n.js
  deploy:
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Start Cloudflare production build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo 'Missing CLOUDFLARE_DEPLOY_HOOK_URL repository secret.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$DEPLOY_HOOK_URL" --output response.json
          jq -e '.success == true and (.result.build_uuid | type == "string")' response.json >/dev/null
          jq -r '"Cloudflare build queued: " + .result.build_uuid' response.json
